name: Playwright tests

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run setup:linux
      - run: npm run typecheck
      - run: npm test
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14

  automated-setup:
    if: github.event_name == 'workflow_dispatch'
    name: Automated setup on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            script: linux
          - os: windows-latest
            script: windows
          - os: macos-latest
            script: macos
    steps:
      - uses: actions/checkout@v5
      - name: Run the setup script and full suite
        shell: bash
        run: bash devenv/${{ matrix.script }}.sh
      - name: Upload Playwright HTML report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.script }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 14
